# Déploiement complet : PostgreSQL + Redis + Django (prod) + Celery
#
# Usage:
#   cp .env.docker.example .env.docker
#   # éditer .env.docker (SECRET_KEY, mots de passe, Meta…)
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# La base PostgreSQL utilise l'image officielle pgvector (pas de build custom).

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatbot_pro}
      POSTGRES_USER: ${POSTGRES_USER:-whatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatbot} -d ${POSTGRES_DB:-whatbot_pro}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: whatbot_pro.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-whatbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-whatbot_pro}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TASK_ALWAYS_EAGER: "false"
      PORT: "8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn whatbot_pro.asgi:application
             -k uvicorn.workers.UvicornWorker
             -b 0.0.0.0:8000
             -w ${WEB_CONCURRENCY:-2}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: whatbot_pro.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-whatbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-whatbot_pro}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A whatbot_pro worker -l info -Q default,whatsapp,payments,notifications,ai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  celery_beat:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: whatbot_pro.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-whatbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-whatbot_pro}
      CELERY_BROKER_URL: redis://redis:6379/1
    command: celery -A whatbot_pro beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - celery_worker

volumes:
  postgres_data:
