name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: whatbot_pro_test
          POSTGRES_USER: whatbot
          POSTGRES_PASSWORD: whatbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: whatbot_pro
        run: |
          pip install -r requirements.txt

      - name: Lint
        working-directory: whatbot_pro
        run: ruff check .

      - name: Run migrations
        working-directory: whatbot_pro
        env:
          DJANGO_SETTINGS_MODULE: whatbot_pro.settings.test
          POSTGRES_HOST: localhost
        run: |
          python manage.py migrate --run-syncdb

      - name: Run tests
        working-directory: whatbot_pro
        env:
          DJANGO_SETTINGS_MODULE: whatbot_pro.settings.test
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=apps --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: whatbot_pro/coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: whatbot_pro
        run: docker build --target production -t whatbot-pro:test .
