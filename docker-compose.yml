services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: whatbot_pro
      POSTGRES_USER: whatbot
      POSTGRES_PASSWORD: whatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatbot -d whatbot_pro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      target: development
    command: daphne -b 0.0.0.0 -p 8000 whatbot_pro.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://whatbot:whatbot@db:5432/whatbot_pro
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      target: development
    command: celery -A whatbot_pro worker -l info -Q default,whatsapp,payments,notifications,ai
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://whatbot:whatbot@db:5432/whatbot_pro
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis
      - web

  celery_beat:
    build:
      context: .
      target: development
    command: celery -A whatbot_pro beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - celery_worker

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
