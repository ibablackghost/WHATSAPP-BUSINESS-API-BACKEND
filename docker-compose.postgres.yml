# PostgreSQL + Redis pour dev local (sans lancer l'app Django dans Docker)
# Usage: docker compose -f docker-compose.postgres.yml up -d

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: whatbot_postgres
    environment:
      POSTGRES_DB: whatbot_pro
      POSTGRES_USER: whatbot
      POSTGRES_PASSWORD: whatbot
    volumes:
      - whatbot_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatbot -d whatbot_pro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: whatbot_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  whatbot_postgres_data:
